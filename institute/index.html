<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>New Brunswick Cardiology Group (Concept A · The Institute)</title>
<meta name="description" content="Concept A · The Institute: a design proposal for New Brunswick Cardiology Group. Not the live website.">
<meta name="theme-color" content="#F6F2EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2EA;--paper2:#EEE7DB;--paper3:#E6DDCE;--ink:#1B1F24;--ink2:#4A4E54;--ink3:#5F6268;
  --ox:#8C1C2B;--ox2:#721522;--sand:#D9CFC1;--brass:#B08D57;--brass2:#D2B583;--slate:#2E3A46;--slate2:#25303A;
  --rule:rgba(27,31,36,.16);--rule2:rgba(27,31,36,.08);
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:clamp(20px,5vw,72px);--max:1360px;--hdr:76px;
  --sec:clamp(76px,10vw,136px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
  font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
svg.ic{width:28px;height:28px;color:var(--ox);flex:none;display:block}
.dark svg.ic{color:var(--brass2)}
.cta svg.ic,.textlink svg.ic,.chip svg.ic{display:inline-block;color:currentColor}
a{color:inherit}
p{margin:0 0 1em}
h1,h2,h3,h4{margin:0;font-weight:400}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ox);outline-offset:3px;border-radius:2px}
.on-dark :focus-visible,.dark :focus-visible{outline-color:var(--brass2)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--ink);color:var(--paper);padding:12px 18px;text-decoration:none;font-weight:500;border-radius:2px}
.skip:focus{top:12px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gut)}
.wrap-n{max-width:980px;margin:0 auto;padding-inline:var(--gut)}
.serif{font-family:var(--serif)}
em,.it{font-style:italic}
.eyebrow{font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ox);display:flex;align-items:center;gap:14px;margin:0 0 22px}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--brass)}
.eyebrow.plain::before{display:none}
.dark .eyebrow,.on-photo .eyebrow{color:var(--brass2)}
.rule{height:1px;background:var(--rule);border:0;margin:0}
.brass-rule{width:56px;height:1px;background:var(--brass);border:0;margin:28px 0}
.d1{font-family:var(--serif);font-weight:300;font-size:clamp(3.1rem,9vw,8.6rem);line-height:.94;letter-spacing:-.02em}
.d2{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,5.6vw,5rem);line-height:1;letter-spacing:-.015em}
.d3{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,3.6vw,3.1rem);line-height:1.06;letter-spacing:-.01em}
.d4{font-family:var(--serif);font-weight:500;font-size:clamp(1.45rem,2.2vw,1.9rem);line-height:1.15}
.d1 em,.d2 em,.d3 em{font-weight:300;color:var(--ox)}
.on-photo .d1 em,.dark .d2 em,.dark .d3 em{color:var(--brass2)}
.lede{font-family:var(--serif);font-size:clamp(1.35rem,2.1vw,1.75rem);line-height:1.38;font-weight:400;color:var(--ink)}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
.sc{font-variant:all-small-caps;letter-spacing:.12em;font-weight:500}
.measure{max-width:68ch}
.prose p{max-width:68ch}
.prose h3{font-family:var(--serif);font-size:1.7rem;font-weight:500;margin:1.6em 0 .5em}
.dropcap>p:first-of-type::first-letter{font-family:var(--serif);float:left;font-size:4.6em;line-height:.82;padding:.06em .1em 0 0;color:var(--ox);font-weight:400}
.break{overflow-wrap:anywhere;word-break:break-word}

/* concept strip */
.strip{background:var(--ink);color:#E9E2D5;font-size:.8rem;line-height:1.35;letter-spacing:.02em;text-align:center;padding:8px var(--gut)}
.strip b{font-weight:600;color:#fff}
.strip a{color:var(--brass2);text-underline-offset:3px}

/* header */
.hdr{position:sticky;top:0;z-index:60;height:var(--hdr);background:rgba(246,242,234,.94);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule2);transition:background .35s var(--ease),color .35s var(--ease),border-color .35s}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:20px}
.hdr.over{background:transparent;color:#FBF8F2;border-color:rgba(255,255,255,.18);backdrop-filter:none;-webkit-backdrop-filter:none}
.wm{display:inline-flex;flex-direction:column;text-decoration:none;line-height:1;min-height:44px;justify-content:center}
.wm-a{font-family:var(--serif);font-size:clamp(1.18rem,2.2vw,1.5rem);font-weight:500;letter-spacing:-.005em;white-space:nowrap}
.wm-b{font-family:var(--serif);font-variant:all-small-caps;font-size:1.02rem;letter-spacing:.24em;margin-top:5px;color:var(--ox);font-weight:500}
.hdr.over .wm-b{color:var(--brass2)}
.hdr-sp{flex:1}
.hdr-tel{display:none;text-decoration:none;font-size:.92rem;letter-spacing:.02em;align-items:center;gap:8px;min-height:44px;padding:0 6px}
.hdr-tel svg{width:17px;height:17px}
.menu-btn{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0 8px;min-height:44px;min-width:44px;font-size:1rem;letter-spacing:.01em}
.menu-btn svg{width:22px;height:22px}
.cta{display:inline-flex;align-items:center;gap:10px;justify-content:center;text-decoration:none;background:var(--ox);color:#fff;border:1px solid var(--ox);border-radius:999px;padding:0 22px;min-height:46px;font-size:.95rem;font-weight:500;letter-spacing:.01em;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease);white-space:nowrap}
.cta:hover{background:var(--ox2);border-color:var(--ox2)}
.cta svg,.cta svg.ic{width:18px;height:18px}
.cta.ghost{background:transparent;color:inherit;border-color:currentColor}
.cta.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.on-photo .cta.ghost:hover,.dark .cta.ghost:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.cta.ink{background:var(--ink);border-color:var(--ink)}
.cta.ink:hover{background:var(--slate)}
.hdr .cta{min-height:44px;padding:0 18px}
.hdr .cta .long{display:none}
@media (min-width:600px){.hdr .cta .long{display:inline}.hdr .cta .short{display:none}}
@media (min-width:1080px){.hdr-tel{display:inline-flex}}
@media (max-width:420px){.hdr .wrap{gap:6px}.wm-a{font-size:1.06rem}.wm-b{font-size:.9rem;letter-spacing:.18em}.menu-btn .lbl{display:none}.hdr .cta{padding:0 14px}}
@media (max-width:374px){.hdr .cta{display:none}}

/* menu overlay */
.menu{position:fixed;inset:0;z-index:120;background:var(--paper);overflow-y:auto;visibility:hidden;opacity:0;transition:opacity .35s var(--ease),visibility 0s .35s}
.menu.open{visibility:visible;opacity:1;transition:opacity .35s var(--ease)}
.menu-top{height:var(--hdr);display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--rule2)}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(24px,3vw,56px);padding-block:clamp(36px,6vw,80px) 40px}
.menu h2{font-family:var(--sans);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ox);font-weight:500;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.menu ul{list-style:none;margin:0;padding:0}
.menu .big a{font-family:var(--serif);font-size:clamp(1.6rem,2.5vw,2.2rem);font-weight:400;line-height:1.1;text-decoration:none;display:flex;align-items:baseline;gap:12px;padding:6px 0;min-height:44px}
.menu .big a .n{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--ox);width:1.9em;flex:none}
.menu .sm a{display:flex;align-items:center;text-decoration:none;color:var(--ink2);font-size:.98rem;min-height:40px;padding:2px 0}
.menu a:hover{color:var(--ox)}
.menu a[aria-current="page"]{color:var(--ox)}
.menu a[aria-current="page"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ox);margin-left:10px;flex:none;align-self:center}
.menu-foot{border-top:1px solid var(--rule);padding-block:28px 40px;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between;font-size:.92rem;color:var(--ink2)}
.menu-foot a{color:var(--ink)}
.menu .li-anim{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.menu.open .li-anim{opacity:1;transform:none}
@media (max-width:980px){.menu-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.menu-grid{grid-template-columns:1fr}}

/* home hero */
.is-home main{margin-top:calc(-1 * var(--hdr))}
.hero{position:relative;min-height:clamp(600px,94vh,980px);display:flex;align-items:flex-end;color:#FBF8F2;overflow:hidden;background:var(--slate)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%;transform:scale(1.04);animation:heroIn 2.4s var(--ease) forwards}
@keyframes heroIn{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,23,27,.55) 0%,rgba(20,23,27,.08) 22%,rgba(20,23,27,.15) 45%,rgba(20,23,27,.82) 100%),linear-gradient(90deg,rgba(20,23,27,.55),rgba(20,23,27,0) 65%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-top:calc(var(--hdr) + 40px);padding-bottom:clamp(110px,14vw,170px)}
.hero h1{max-width:12ch;text-shadow:0 1px 30px rgba(0,0,0,.25)}
.hero h1 em{color:#E7CFA4}
.hero-sub{max-width:44ch;font-size:clamp(1.02rem,1.4vw,1.18rem);line-height:1.6;margin:28px 0 34px;color:#F1ECE3}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero .cta.ghost{color:#fff}
.plate{position:absolute;right:var(--gut);bottom:clamp(110px,14vw,170px);z-index:2;text-align:right;font-family:var(--serif);font-size:1.02rem;letter-spacing:.14em;font-variant:all-small-caps;color:#EFE7DA;line-height:1.5}
.plate i{font-variant:normal;letter-spacing:0;font-style:italic;font-size:1rem;display:block;color:#D8CDBB}
@media (max-width:860px){.plate{display:none}}

/* action bar */
.actions{position:relative;z-index:5;margin-top:calc(-1 * clamp(56px,7vw,78px))}
.actions ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FBF9F4;box-shadow:0 30px 60px -30px rgba(27,31,36,.35),0 1px 0 rgba(27,31,36,.06);border-top:2px solid var(--ox)}
.actions li+li{border-left:1px solid var(--rule)}
.actions a{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(22px,2.6vw,34px) clamp(18px,2.4vw,34px);text-decoration:none;min-height:112px;height:100%;transition:background .25s}
.actions a:hover{background:var(--paper2)}
.actions .k{display:block;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.actions .v{display:block;font-family:var(--serif);font-size:clamp(1.3rem,1.9vw,1.65rem);line-height:1.12}
.actions svg{width:22px;height:22px;color:var(--ox);flex:none;transition:transform .3s var(--ease)}
.actions a:hover svg{transform:translateX(4px)}
@media (max-width:900px){.actions ul{grid-template-columns:repeat(2,minmax(0,1fr))}.actions li:nth-child(3){border-left:0}.actions li:nth-child(n+3){border-top:1px solid var(--rule)}}
@media (max-width:420px){.actions a{min-height:96px;padding:18px 14px;gap:8px}.actions .v{font-size:1.14rem}.actions .k{letter-spacing:.12em}}

/* sections */
.sec{padding-block:var(--sec)}
.sec.tight{padding-block:clamp(56px,7vw,96px)}
.sec.alt{background:var(--paper2)}
.sec.sand{background:var(--sand)}
.dark{background:var(--slate);color:#EFE9DF}
.dark .muted{color:#C9C2B6}
.dark.ink{background:var(--ink)}
.sec-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,96px);align-items:end;margin-bottom:clamp(40px,6vw,80px)}
.sec-head p{margin:0;max-width:52ch}
@media (max-width:860px){.sec-head{grid-template-columns:1fr}}
.textlink{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;border-bottom:1px solid currentColor;padding:8px 0 4px;min-height:44px;color:var(--ox)}
.dark .textlink{color:var(--brass2)}
.textlink svg,.textlink svg.ic{width:18px;height:18px;transition:transform .3s var(--ease)}
.textlink:hover svg{transform:translateX(4px)}

/* intro statement */
.statement{font-family:var(--serif);font-weight:300;font-size:clamp(1.7rem,3.4vw,3rem);line-height:1.18;letter-spacing:-.01em;max-width:26ch}
.statement em{color:var(--ox)}
.intro-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(32px,6vw,110px);align-items:end}
@media (max-width:900px){.intro-grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink);margin-top:clamp(56px,7vw,96px)}
.stats div{padding:22px 18px 0 0}
.stats div+div{padding-left:18px;border-left:1px solid var(--rule)}
.stats b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,4.2vw,3.8rem);line-height:1;letter-spacing:-.02em}
.stats span{display:block;font-size:.86rem;color:var(--ink2);margin-top:10px;line-height:1.4}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,1fr)}.stats div:nth-child(4){border-left:0;padding-left:0}.stats div:nth-child(n+4){margin-top:26px;border-top:1px solid var(--rule)}}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats div{border-left:0!important;padding-left:0!important;padding-right:10px}.stats div:nth-child(odd){padding-right:14px}.stats div:nth-child(even){padding-left:14px!important;border-left:1px solid var(--rule)!important}.stats div:nth-child(n+3){margin-top:22px;border-top:1px solid var(--rule)}}

/* disciplines index */
.idx{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule);counter-reset:i}
.idx li{border-top:1px solid var(--rule)}
.idx a{display:grid;grid-template-columns:88px minmax(0,1.1fr) minmax(0,1fr) 40px;gap:24px;align-items:center;padding:30px 0;text-decoration:none;position:relative;transition:padding .45s var(--ease),background .45s}
.idx a::before{content:"";position:absolute;inset:0 calc(-1 * var(--gut));background:var(--paper2);opacity:0;transition:opacity .4s;z-index:-1}
.idx a:hover::before{opacity:1}
.idx a:hover{padding-left:12px}
.idx .rn{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--ox)}
.idx .t{font-family:var(--serif);font-size:clamp(1.7rem,3vw,2.6rem);line-height:1.05;font-weight:400}
.idx .s{color:var(--ink2);font-size:1rem;line-height:1.5}
.idx svg{width:24px;height:24px;color:var(--ox);justify-self:end;transition:transform .35s var(--ease)}
.idx a:hover svg{transform:translateX(5px)}
.idx-wrap{position:relative;isolation:isolate}
.idx.compact a::before{inset:0 -14px}
@media (max-width:820px){.idx a{grid-template-columns:52px minmax(0,1fr) 28px;gap:14px;padding:24px 0}.idx .s{grid-column:2/3;grid-row:2}.idx svg{grid-row:1/3;grid-column:3}}

/* physicians wall */
.wall{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.pc{text-decoration:none;display:block}
.pc figure{margin:0;position:relative;overflow:hidden;background:var(--sand);aspect-ratio:4/5;max-width:360px}
.pc img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s}
.pc:hover img{transform:scale(1.04)}
.pc figure::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(27,31,36,.08)}
.pc .nm{display:block;font-family:var(--serif);font-size:1.32rem;line-height:1.15;margin-top:14px}
.pc .cr{display:block;font-size:.8rem;letter-spacing:.06em;color:var(--ink3);margin-top:4px}
.pc .sp{display:block;font-size:.9rem;color:var(--ink2);margin-top:8px;line-height:1.4}
@media (max-width:1180px){.wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:340px){.pc .nm{font-size:1.15rem}}

/* split feature */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,7vw,120px);align-items:center}
.split.rev{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.split figure{margin:0}
.split figcaption,.cap{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--ink2);margin-top:12px;display:flex;gap:12px;align-items:baseline}
.cap .sc{font-style:normal;color:var(--ox);font-size:1rem}
.dark .cap,.dark figcaption{color:#C9C2B6}
.dark .cap .sc{color:var(--brass2)}
@media (max-width:900px){.split,.split.rev{grid-template-columns:1fr}}
.accred{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.accred li{padding:20px 14px 0 0}
.accred li+li{border-left:1px solid var(--rule);padding-left:16px}
.accred b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:500;line-height:1.15}
.accred span{font-size:.82rem;color:var(--ink2);letter-spacing:.04em}
.dark .accred,.dark .accred li+li{border-color:rgba(255,255,255,.16)}
.dark .accred span{color:#C9C2B6}
@media (max-width:440px){.accred{grid-template-columns:1fr}.accred li+li{border-left:0;padding-left:0;border-top:1px solid var(--rule);margin-top:16px}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:40px;overflow-x:auto;overflow-y:hidden}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 4px;margin-right:28px;font-family:var(--serif);font-size:clamp(1.3rem,2.2vw,1.7rem);cursor:pointer;color:var(--ink3);min-height:48px;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ox)}
.tabpanel[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.tile{display:flex;flex-direction:column;gap:12px;padding:28px 26px 30px;text-decoration:none;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:210px;transition:background .3s}
.tile:hover{background:#FBF9F4}
.tile svg.ic{width:28px;height:28px;color:var(--ox);margin-bottom:14px}
.tile .t{font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.tile .s{font-size:.92rem;color:var(--ink2);line-height:1.45}
@media (max-width:1000px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}

/* map */
.offices{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:start}
@media (max-width:900px){.offices{grid-template-columns:1fr}}
.map{background:var(--paper3);position:relative;padding:clamp(14px,2vw,26px);border:1px solid var(--rule2)}
.map svg{width:100%;height:auto;display:block;max-height:640px}
.map .legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.82rem;color:var(--ink2);margin-top:10px;align-items:center}
.map .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ox);margin-right:6px;vertical-align:-1px}
.map .legend i.h{background:none;border:1.5px solid var(--slate);transform:rotate(45deg);border-radius:0;width:9px;height:9px}
.pin{cursor:pointer}
.pin circle.halo{transition:r .35s var(--ease),opacity .35s;opacity:0}
.pin.hl circle.halo,.pin:hover circle.halo,.pin:focus circle.halo{opacity:.18}
.pin text{font-family:var(--serif)}
.olist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.olist li{border-bottom:1px solid var(--rule);padding:26px 0}
.olist .rn{font-family:var(--serif);font-style:italic;color:var(--ox);font-size:1.15rem;margin-right:10px}
.olist h3{font-family:var(--serif);font-size:1.9rem;line-height:1.1;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.olist h3 a{text-decoration:none}
.olist h3 a:hover{color:var(--ox)}
.olist .tag{font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.olist address{font-style:normal;margin:10px 0 6px;color:var(--ink)}
.olist .hrs{font-size:.94rem;color:var(--ink2)}
.olist .lnks{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:8px}
.olist .lnks a{font-size:.94rem}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:calc(clamp(3rem,6vw,5.6rem) + 26px);height:1px;background:var(--brass)}
.tl li{padding-right:clamp(16px,2.5vw,40px);position:relative}
.tl .yr{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,6vw,5.6rem);line-height:1;letter-spacing:-.03em;display:block;height:clamp(3rem,6vw,5.6rem)}
.tl .yr.w{font-style:italic;font-size:clamp(2rem,3.6vw,3.3rem);padding-top:clamp(.8rem,2vw,2rem);color:var(--ox)}
.tl .dot{display:block;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ox);margin:20px 0 26px;position:relative;z-index:2}
.dark .tl .dot{background:var(--slate);border-color:var(--brass2)}
.tl li:last-child .dot{background:var(--ox)}
.tl h3{font-family:var(--serif);font-size:1.5rem;line-height:1.15;margin-bottom:10px;font-weight:500}
.tl p{font-size:.96rem;color:var(--ink2);margin:0}
.dark .tl p{color:#CFC8BC}
.dark .tl .yr.w{color:var(--brass2)}
@media (max-width:900px){.tl{grid-template-columns:1fr;padding-left:34px}.tl::before{left:5px;right:auto;top:8px;bottom:8px;width:1px;height:auto}.tl li{padding:0 0 44px}.tl .dot{position:absolute;left:-34px;top:calc(clamp(3rem,6vw,5.6rem)/2 - 5px);margin:0}.tl .yr{height:auto;margin-bottom:12px}.tl .yr.w{padding-top:0}}

/* referring band */
.band{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,100px);align-items:end}
@media (max-width:900px){.band{grid-template-columns:1fr}}

/* page head */
.ph{padding-top:clamp(36px,5vw,64px);padding-bottom:clamp(40px,6vw,84px);border-bottom:1px solid var(--rule)}
.crumbs{list-style:none;margin:0 0 clamp(36px,5vw,64px);padding:0;display:flex;flex-wrap:wrap;gap:6px 0;font-size:.85rem;color:var(--ink3)}
.crumbs li{display:flex;align-items:center}
.crumbs li+li::before{content:"/";margin:0 10px;color:var(--brass)}
.crumbs a{text-decoration:none;color:var(--ink2);display:inline-flex;min-height:32px;align-items:center}
.crumbs a:hover{color:var(--ox);text-decoration:underline}
.ph-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,5vw,90px);align-items:end}
.ph h1{max-width:16ch;font-size:clamp(2.3rem,6.4vw,6.2rem);overflow-wrap:break-word;hyphens:manual}
h1{overflow-wrap:break-word}
.ph .lede{margin:0;color:var(--ink2)}
@media (max-width:900px){.ph-grid{grid-template-columns:1fr}}
.ph-photo{margin:0;position:relative}
.ph-photo img{width:100%;aspect-ratio:21/8;object-fit:cover}
@media (max-width:700px){.ph-photo img{aspect-ratio:4/3}}

/* generic layout */
.cols{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(28px,6vw,110px)}
.cols>aside{position:relative}
.sticky{position:sticky;top:calc(var(--hdr) + 28px)}
@media (max-width:900px){.cols{grid-template-columns:1fr}.sticky{position:static}}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.facts li{padding:16px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:16px;font-size:.98rem}
.facts .k{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding-top:4px;font-weight:500}
.facts a{color:var(--ink)}
.card{background:#FBF9F4;border:1px solid var(--rule2);padding:clamp(22px,3vw,36px)}
.dark .card{background:var(--slate2);border-color:rgba(255,255,255,.1)}
.notice{border-left:2px solid var(--ox);padding:4px 0 4px 20px;margin:28px 0}
.notice strong{font-weight:600}
.big-tel{font-family:var(--serif);font-weight:300;font-size:clamp(2.3rem,5vw,4.2rem);line-height:1;text-decoration:none;letter-spacing:-.01em;display:inline-block;padding:4px 0}
.big-tel:hover{color:var(--ox)}
.dark .big-tel:hover{color:var(--brass2)}
.list-plain{list-style:none;margin:0;padding:0}
.list-rule{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list-rule li{border-bottom:1px solid var(--rule);padding:14px 0}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:0 16px;min-height:44px;font-size:.92rem;background:transparent;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--rule)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,40px)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* physicians index */
.toolbar{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:end;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--rule);margin-bottom:clamp(36px,5vw,60px)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lb{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500}
select,input[type=search]{font:inherit;font-size:1rem;color:var(--ink);background:#FBF9F4;border:1px solid var(--rule);border-radius:0;padding:0 14px;min-height:48px;min-width:200px;max-width:100%}
input[type=search]{min-width:min(360px,100%);width:100%}
select:focus-visible,input:focus-visible{outline:2px solid var(--ox);outline-offset:0}
.count{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:1.1rem}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(34px,4vw,56px) clamp(20px,3vw,40px)}
.roster .pc figure{max-width:360px}
.roster .pc .nm{font-size:1.6rem}
.roster .no{font-family:var(--serif);font-style:italic;color:var(--ox);font-size:1rem;display:block;margin-top:14px}
.roster .lg{display:block;font-size:.84rem;color:var(--ink3);margin-top:8px}
.empty{padding:40px 0;font-family:var(--serif);font-size:1.4rem;font-style:italic}

/* profile */
.prof-head{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(28px,6vw,100px);align-items:end;padding-bottom:clamp(40px,6vw,80px);border-bottom:1px solid var(--rule)}
.prof-head figure{margin:0;max-width:340px}
.prof-head figure img{width:100%;aspect-ratio:4/5;object-fit:cover}
.prof-head h1{font-size:clamp(2.8rem,6.4vw,6rem)}
.prof-head .cr{font-size:.86rem;letter-spacing:.16em;color:var(--ink3);margin-top:16px;text-transform:uppercase}
.pull{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.6rem,3vw,2.5rem);line-height:1.2;color:var(--ox);margin:34px 0 0;padding-left:28px;border-left:1px solid var(--brass);max-width:30ch;position:relative}
.pull::before{content:"“";position:absolute;left:-6px;top:-.42em;font-size:3.4em;color:var(--brass);opacity:.55;font-style:normal;line-height:1;transform:translateX(-100%)}
@media (max-width:760px){.prof-head{grid-template-columns:1fr}.prof-head figure{max-width:180px}.pull::before{display:none}}
.cv{width:100%;border-collapse:collapse;margin-top:12px}
.cv caption{text-align:left;font-family:var(--serif);font-size:1.8rem;padding-bottom:16px}
.cv th,.cv td{text-align:left;vertical-align:top;padding:18px 0;border-top:1px solid var(--rule)}
.cv tr:last-child th,.cv tr:last-child td{border-bottom:1px solid var(--rule)}
.cv th{width:34%;font-weight:500;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding-right:20px;padding-top:23px}
.cv td{font-family:var(--serif);font-size:1.22rem;line-height:1.35}
.cv td span{display:block}
.cv td span+span{margin-top:6px}
@media (max-width:560px){.cv th,.cv td{display:block;width:100%;padding:12px 0 0}.cv td{border-top:0;padding:4px 0 16px}}
.disc-links{display:flex;flex-wrap:wrap;gap:8px}
.honor{font-family:var(--serif);font-size:1.25rem;line-height:1.35}
.sec-label{font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ox);font-weight:500;margin:0 0 16px}
.pnav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pnav a{padding:30px 0;text-decoration:none;display:block}
.pnav a+a{border-left:1px solid var(--rule);padding-left:clamp(16px,3vw,40px);text-align:right}
.pnav small{display:block;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.pnav span{font-family:var(--serif);font-size:clamp(1.3rem,2.4vw,1.9rem)}
.pnav a:hover span{color:var(--ox)}

/* staff */
.staff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--ink)}
.staff article{padding:clamp(28px,4vw,48px) clamp(0px,3vw,48px) clamp(28px,4vw,48px) 0;border-bottom:1px solid var(--rule)}
.staff article:nth-child(even){padding-left:clamp(20px,3vw,48px);border-left:1px solid var(--rule)}
.mono{width:72px;height:72px;border-radius:50%;border:1px solid var(--brass);display:grid;place-items:center;font-family:var(--serif);font-size:1.6rem;font-style:italic;color:var(--ox);margin-bottom:22px}
.staff h2{font-family:var(--serif);font-size:2rem;line-height:1.1}
.staff .role{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:8px 0 18px}
.staff h3{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ox);font-weight:500;margin:20px 0 8px}
.staff ul{margin:0;padding-left:18px;font-size:.96rem;color:var(--ink2)}
.staff ul li{margin-bottom:4px}
@media (max-width:760px){.staff{grid-template-columns:1fr}.staff article:nth-child(even){padding-left:0;border-left:0}}

/* service page */
.svc-num{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(5rem,12vw,11rem);line-height:.8;color:var(--ox);opacity:.9}
.proc{list-style:none;margin:0;padding:0;counter-reset:p;border-top:1px solid var(--rule)}
.proc li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:1.28rem;line-height:1.3}
.proc li::before{content:counter(p,lower-roman) ".";font-style:italic;color:var(--ox);font-size:1.05rem;padding-top:3px}
.mini-phys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.mini-phys .pc .nm{font-size:1.15rem}

/* education */
.edu-group{padding:34px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px}
.edu-group h2{font-family:var(--serif);font-size:1.9rem;line-height:1.1}
.edu-group h2 small{display:block;font-family:var(--sans);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
.edu-links{list-style:none;margin:0;padding:0}
.edu-links li{border-bottom:1px solid var(--rule2)}
.edu-links li:first-child{border-top:1px solid var(--rule2)}
.edu-links a{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:12px 0;text-decoration:none;min-height:56px}
.edu-links a:hover .lt{color:var(--ox);text-decoration:underline;text-underline-offset:3px}
.edu-links svg{width:20px;height:20px;color:var(--ox)}
.edu-links .lt{font-size:1.02rem;line-height:1.35}
.edu-links .lm{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:right;white-space:nowrap}
.edu-links .sub{display:block;font-size:.8rem;color:var(--ink3);margin-top:2px}
@media (max-width:820px){.edu-group{grid-template-columns:1fr}}
@media (max-width:480px){.edu-links a{grid-template-columns:24px 1fr}.edu-links .lm{grid-column:2;text-align:left}}

/* videos */
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,36px)}
@media (max-width:980px){.vids{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.vids{grid-template-columns:1fr}}
.vid .frame{position:relative;aspect-ratio:16/9;background:var(--slate);overflow:hidden}
.vid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid button.facade{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;background:radial-gradient(120% 90% at 80% 10%,#3A4855 0%,var(--slate) 45%,var(--ink) 100%);color:#F2ECE2;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:18px 20px;text-align:left}
.vid button.facade::before{content:"";position:absolute;inset:12px;border:1px solid rgba(210,181,131,.35);pointer-events:none}
.vid .pl{width:58px;height:58px;border-radius:50%;border:1px solid var(--brass2);display:grid;place-items:center;transition:background .3s,transform .3s var(--ease);position:relative}
.vid .pl svg{width:22px;height:22px;margin-left:3px}
.vid button.facade:hover .pl{background:var(--ox);border-color:var(--ox);transform:scale(1.06)}
.vid .fn{font-family:var(--serif);font-style:italic;font-size:2.4rem;line-height:1;color:rgba(242,236,226,.9);position:relative}
.vid .src{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#D9CDB8;position:relative}
.vid h3{font-family:var(--serif);font-size:1.32rem;line-height:1.25;margin:14px 0 6px}
.vid .w{font-size:.9rem}

/* legal */
.legal h2{font-family:var(--serif);font-size:1.75rem;font-weight:500;margin:2.1em 0 .5em;line-height:1.15}
.legal dl{margin:0 0 1em}
.legal dt{font-weight:600;margin-top:12px}
.legal dd{margin:2px 0 0;color:var(--ink2)}
.legal p{max-width:72ch;color:var(--ink)}
.toc{list-style:none;margin:0;padding:0;font-size:.92rem}
.toc a{display:flex;min-height:36px;align-items:center;text-decoration:none;color:var(--ink2)}
.toc a:hover{color:var(--ox)}

/* planner */
.planner fieldset{border:0;margin:0 0 34px;padding:0}
.planner legend{font-family:var(--serif);font-size:1.6rem;margin-bottom:16px;padding:0;display:flex;gap:12px;align-items:baseline}
.planner legend .rn{font-style:italic;color:var(--ox);font-size:1.1rem}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;align-items:center;min-height:52px;padding:10px 18px;border:1px solid var(--rule);background:#FBF9F4;cursor:pointer;transition:border-color .2s,background .2s;line-height:1.35}
.opt span::before{content:"";width:14px;height:14px;border-radius:50%;border:1px solid var(--ink3);margin-right:14px;flex:none;transition:all .2s}
.opt input:checked+span{border-color:var(--ox);background:#fff}
.opt input:checked+span::before{border:4px solid var(--ox)}
.opt input:focus-visible+span{outline:2px solid var(--ox);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

/* footer */
.ftr{background:var(--ink);color:#DDD6CA;padding-top:clamp(64px,8vw,110px);font-size:.95rem}
.ftr a{color:#F2ECE2;text-decoration:none}
.ftr a:hover{color:var(--brass2);text-decoration:underline;text-underline-offset:3px}
.ftr a[aria-current="page"]{color:var(--brass2)}
.ftr-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(36px,6vw,100px);padding-bottom:clamp(48px,6vw,80px);border-bottom:1px solid rgba(255,255,255,.12)}
.ftr .wm-a{font-size:clamp(2rem,4vw,3.2rem);white-space:normal;color:#F6F2EA}
.ftr .wm-b{color:var(--brass2);font-size:1.2rem}
.ftr-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.ftr h2{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass2);font-weight:500;margin-bottom:16px}
.ftr ul{list-style:none;margin:0;padding:0}
.ftr li a{display:inline-flex;min-height:34px;align-items:center;line-height:1.35;padding:3px 0}
.ftr-off{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-block:40px;border-bottom:1px solid rgba(255,255,255,.12)}
.ftr-off h3{font-family:var(--serif);font-size:1.45rem;color:#F6F2EA;margin-bottom:6px}
.ftr-off p{margin:0;color:#CFC7BA;font-size:.92rem;line-height:1.55}
.ftr-bot{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;padding-block:28px 36px;font-size:.84rem;color:#BDB5A8}
.ftr-bot .concept{color:#E7DECF}
.ftr .em{border:1px solid rgba(210,181,131,.4);padding:16px 18px;margin-top:26px;font-size:.9rem;color:#E8E1D5;max-width:44ch}
.ftr .em strong{color:#fff}
@media (max-width:1000px){.ftr-top{grid-template-columns:1fr}.ftr-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.ftr-off{grid-template-columns:1fr}}
@media (max-width:380px){.ftr-cols{grid-template-columns:1fr}}

/* mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(27,31,36,.97);color:#F2ECE2;display:none;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(210,181,131,.35)}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;text-decoration:none;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
.dock a+a{border-left:1px solid rgba(255,255,255,.1)}
.dock svg{width:20px;height:20px;color:var(--brass2)}
@media (max-width:899px){.dock{display:grid}body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}}

/* reveal & motion */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
#main{outline:0}
.page-enter{animation:pageIn .6s var(--ease)}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1;transform:none}
  .hero img{transform:none}
}
h1[tabindex="-1"]:focus,h1[tabindex="-1"]:focus-visible{outline:none}

/* concept page */
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.sw{border:1px solid var(--rule2)}
.sw i{display:block;aspect-ratio:1/1}
.sw div{padding:10px 12px;font-size:.82rem}
.sw b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:500}
@media (max-width:820px){.swatches{grid-template-columns:repeat(3,1fr)}}
.refs{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.refs li{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--rule)}
.refs b{font-family:var(--serif);font-size:1.4rem;font-weight:500;display:block;line-height:1.15}
@media (max-width:700px){.refs li{grid-template-columns:1fr;gap:6px}}
.nf{min-height:60vh;display:flex;align-items:center}
/* QA polish */
.nw{white-space:nowrap}
.hdr-tel{white-space:nowrap}
.tile.tile-dark{background:var(--ink);color:var(--paper)}
.tile.tile-dark:hover{background:var(--slate)}
.tile.tile-dark svg.ic{color:var(--brass2)}
.tile.tile-dark .s{color:#D8D1C5}
.pull.no-mark::before{display:none}
.vid .pl svg.ic{color:var(--brass2);transition:color .3s}
.vid button.facade:hover .pl svg.ic,.vid button.facade:focus-visible .pl svg.ic{color:#fff}
.stats b,.big-tel{font-variant-numeric:lining-nums}
.ct-nm{display:block;font-family:var(--serif);font-weight:500;font-size:1.22rem;line-height:1.15;margin-bottom:2px}
.ph{padding-bottom:clamp(32px,4vw,52px)}
.ph + .sec,.ph + .sec.tight{padding-top:clamp(36px,4.5vw,60px)}
@media (max-width:700px){.hero::after{background:linear-gradient(180deg,rgba(20,23,27,.6) 0%,rgba(20,23,27,.3) 22%,rgba(20,23,27,.55) 45%,rgba(20,23,27,.9) 72%,rgba(20,23,27,.94) 100%)}}

ata synching with location, plan routes, or create a mashup just to name a few. Google Maps API may collect information from You and from Your Device for security purposes. Google Maps API collects information that is held in accordance with its Privacy Policy."}, {"h": "Cookies"}, {"p": "We use Cookies to enhance the performance and functionality of our platform but are non-essential to their use. However, without these cookies, certain functionality like videos may become unavailable or you would be required to enter your login details every time you visit the platform as we would not be able to remember that you had logged in previously."}, {"h": "Contact Us"}, {"p": "Don't hesitate to contact us if you have any questions."}, {"p": "Phone: 1 (732) 247-7444"}, {"p": "Or visit the Contact page."}]}, "accessibility": {"title": "Accessibility Statement", "updated": "January 2025", "blocks": [{"h": "General"}, {"p": "New Brunswick Cardiology Group, P.A. strives to ensure that its services are accessible to people with disabilities. New Brunswick Cardiology Group, P.A. has invested a significant amount of resources to help ensure that its website is made easier to use and more accessible for people with disabilities, with the strong belief that every person has the right to live with dignity, equality, comfort and independence."}, {"h": "Accessibility on Nbcardiology.com"}, {"p": "Nbcardiology.com makes available the UserWay Website Accessibility Widget that is powered by a dedicated accessibility server. The software allows Nbcardiology.com to improve its compliance with the Web Content Accessibility Guidelines (WCAG 2.1)."}, {"h": "Enabling the Accessibility Menu"}, {"p": "The Nbcardiology.com accessibility menu can be enabled either by hitting the tab key when the page first loads or by clicking the accessibility menu icon that appears on the corner of the page. After triggering the accessibility menu, please wait a moment for the accessibility menu to load in its e o be nor do they constitute actionable professional advice. Transmissions of this information is not intended to create a professional-client relationship between New Brunswick Cardiology Group, P.A. and you. The owners, editors, contributors, administrators, and other staff of New Brunswick Cardiology Group, P.A. are not qualifies professionals, and are simply aggregating information found online for informational purposes only."}, {"p": "If you think you may have a medical emergency, call your doctor or 911 immediately. New Brunswick Cardiology Group, P.A. does not recommend or endorse any specific tests, physicians, products, procedures, opinions, or other information that may be mentioned on the website. Reliance on any information provided by New Brunswick Cardiology Group, P.A., New Brunswick Cardiology Group, P.A. employees, others appearing on the website at the invitation of New Brunswick Cardiology Group, P.A., or other visitors to the website is solely at your own risk."}, {"h": "Educational Disclosure"}, {"p": "Any Information provided by New Brunswick Cardiology Group, P.A. is for educational purposes only, and is not to be interpreted as a recommendation for a specific treatment plan, product, or course of action. New Brunswick Cardiology Group, P.A. is a distributor and not a publisher of the content supplied by third parties; as such, New Brunswick Cardiology Group, P.A. exercises no editorial control over such content and makes no warranty or representation as to the accuracy, reliability or currency of any information or educational content provided through or accessible via New Brunswick Cardiology Group, P.A.. Without limiting the foregoing, New Brunswick Cardiology Group, P.A. specifically disclaims all warranties and representations in any content transmitted on or in connection with New Brunswick Cardiology Group, P.A. or on sites that may appear as links on New Brunswick Cardiology Group, P.A., or in the products provided as a part of, or otherwise in connection with, the New Brunswick Cardiology Group, P.A.. No oral advice or written information given by New Brunswick Cardiology Group, P.A. or any of its affiliates, employees, officers, directors, agents, or the like will create a warranty."}, {"h": "Testimonials Disclosure"}, {"p": "Any testimonials provided on this platform are opinions of those providing them. The information provided in the testimonials is not to be relied upon to predict results in your specific situation. The results you experience will be dependent on many factors including but not limited to your level of personal responsibility, commitment, and abilities, in addition to those factors that you and/or New Brunswick Cardiology Group, P.A. may not be able to anticipate."}, {"p": "New Brunswick Cardiology Group, P.A. does not guarantee the same results as the testimonials given on our platform. Testimonials presented on New Brunswick Cardiology Group, P.A. are applicable to the individuals writing them, and may not be indicative of future success of any other individuals."}, {"h": "Your Consent"}, {"p": "We've updated our Disclaimer to provide you with complete transparency into what is being set when you visit our site and how it's being used. By using our website, registering an account, or making a purchase, you hereby consent to our Disclaimer and agree to its terms."}, {"h": "Changes To Our Disclaimer"}, {"p": "Should we update, amend or make any changes to this document so that they accurately reflect our Service and policies. Unless otherwise required by law, those changes will be prominently posted here. Then, if you continue to use the Service, you will be bound by the updated Disclaimer. If you do not want to agree to this or any updated Disclaimer, you can delete your account."}, {"h": "Contact Us"}, {"p": "Don't hesitate to contact us if you have any questions regarding this Disclaimer."}, {"p": "Phone: 1 (732) 247-7444"}, {"p": "Via this Link: https://www.nbcardiology.com/contact-us/"}]}}, "portals": {"rwj": "https://mychart.rwjbh.org/MyChart/Authentication/Login", "sp": "https://www.sphealth.org/patients-visitors/mychartpatient-portal"}, "forms": "https://www.nbcardiology.com/library/NBCG_Patient-Documents.pdf", "remote": [{"l": "RWJBH Login", "u": "https://remote.rwjbh.org"}, {"l": "St. Peter’s Login", "u": "https://citrix.saintpetersuh.com"}, {"l": "RWJBH WebMail", "u": "https://webmail.rwjbh.org/logon/LogonPoint/tmindex.html"}, {"l": "Longcall", "u": "https://outlook.office365.com"}], "contact": {"APPOINTMENTS": "Appointments are required for office visits and diagnostic studies. We appreciate 24 hour advance notice if you need to cancel or reschedule your appointment.", "IN THE EVENT OF AN EMERGENCY": "We provide 24 hour coverage. If you have an emergency after hours, please call our answering service at 1 (732) 247-7444 and follow the instructions; one of our doctors is always available.", "PRESCRIPTION RENEWALS": "For prescription renewal request, please have your pharmacy call or fax a prescription request renewal to the office between 9 AM and 5 PM Monday – Friday. Please inform your pharmacy to call you once the prescription is ready for pick up. Please be advised, prescription renewals require 3 business days to process.", "MEDICAL RECORDS": "A written request is required from the patient for copies of medical records. The process may take up to 30 days."}, "services": {"NON-INVASIVE CARDIOLOGY": {"title": "NON-INVASIVE CARDIOLOGY", "text": "In many instances, the first step in treating cardiovascular disease is diagnosing the problem. A thorough consultation will be performed to determine the best treatment option for you. If needed, our physicians are skilled in performing cardiac catheterizations and transesophageal echocardiograms. We are able to perform most diagnostic tests at each of our three office locations.", "procedures_mentioned": ["cardiac catheterizations", "transesophageal echocardiograms"], "image": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Echocardiogram-Exam-640x427.jpg", "image_full": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Echocardiogram-Exam.jpg", "image_alt": "Examining heart patient using echocardiogram"}, "INTERVENTIONAL CARDIOLOGY": {"title": "INTERVENTIONAL CARDIOLOGY", "text": "Our interventionalists also perform IVC Filter placement, renal artery stenting, and lower extremity arterial angioplasty and stenting.", "procedures_mentioned": ["IVC Filter placement", "renal artery stenting", "lower extremity arterial angioplasty and stenting"], "image": null, "note": "Text begins with \"also\" — appears to be a truncated section on the live site (no lead-in describing core interventional work)."}, "STRUCTURAL CARDIOLOGY": {"title": "STRUCTURAL CARDIOLOGY", "text": "Structural cardiology is a specialized branch of cardiology focused on diagnosing and treating abnormalities or defects in the structure of the heart. Our Cardiologists use the latest devices to provide the best care for our patients. Dr. Shah is trained in performing Transcatheter Aortic Valve Replacement (TAVR), Transcatheter Edge-to-Edge Repair (TEER) including MitraClip, Left Atrial Appendage Closure, ASD and PFO closure.", "procedures_mentioned": ["Transcatheter Aortic Valve Replacement (TAVR)", "Transcatheter Edge-to-Edge Repair (TEER) including MitraClip", "Left Atrial Appendage Closure", "ASD closure", "PFO closure"], "image": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Structural-Cardiology_hr-640x427.jpg", "image_full": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Structural-Cardiology_hr.jpg", "image_alt": "Structural cardiology - diagnosing and treating abnormalities or defects in the structure of the heart."}, "ELECTROPHYSIOLOGY": {"title": "ELECTROPHYSIOLOGY", "text": "Our Electrophysiologists use the latest technology in atrial fibrillation ablation to care for our arrhythmia patients. Advances in the technology provide patients with greater symptom relief and may eliminate the need for medications. At New Brunswick Cardiology Group we specialize in pacemaker and defibrillator management with device interrogations and evaluations. We perform implantation of the most complex devices, heart monitoring, tilt table testing, EP studies, ablations and now WATCHMAN (Left Atrial Appendage Closure Device) implantation. Dr. Gowda is one of the most experienced physicians in the region in performing over 100 atrial fibrillation ablations per year.", "procedures_mentioned": ["atrial fibrillation ablation", "pacemaker and defibrillator management with device interrogations and evaluations", "implantation of the most complex devices", "heart monitoring", "tilt table testing", "EP studies", "ablations", "WATCHMAN (Left Atrial Appendage Closure Device) implantation"], "image": "https://www.nbcardiology.com/wp-content/uploads/2025/02/IAC-Echo-281x300-1.jpg", "image_alt": "IAC Echocardiography Accredited Facility"}, "NUCLEAR CARDIOLOGY/STRESS TESTING": {"title": "NUCLEAR CARDIOLOGY/STRESS TESTING", "text": "New Brunswick Cardiology Group performs all exercise and nuclear stress tests in its Nationally Accredited Nuclear Medicine Department, using state-of-the-art technology. C-Cam, this award winning dual head Gamma Camera includes a reclining chair that provides increased patient comfort, which leads to better image quality and increased diagnostic confidence.", "procedures_mentioned": ["exercise stress tests", "nuclear stress tests", "C-Cam dual head Gamma Camera imaging"], "image": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Exercise-Nuclear-StressTests_hr-640x427.jpg", "image_full": "https://www.nbcardiology.com/wp-content/uploads/2025/10/Exercise-Nuclear-StressTests_hr.jpg", "image_alt": "We perform all exercise and nuclear stress tests using state-of-the-art technology.", "badge": "https://www.nbcardiology.com/wp-content/uploads/2025/02/IAC-Nuclear-283x300-1.jpg"}, "VASCULAR ULTRASOUND": {"title": "VASCULAR ULTRASOUND", "text": "Vascular ultrasound is the general term for a non-invasive painless test that uses high-frequency sound waves to image blood vessels including arteries and veins.\n\nOur imaging department is a nationally accredited laboratory to evaluate arterial and venous disease of the aorta, kidney, carotids, upper and lower extremities.", "procedures_mentioned": ["arterial and venous evaluation of the aorta, kidney, carotids, upper and lower extremities"], "image": "https://www.nbcardiology.com/wp-content/uploads/2025/02/Patient-Exam-420w.png", "image_alt": "Patient undergoing Vascular Exam", "badge": "https://www.nbcardiology.com/wp-content/uploads/2025/02/IAC-Vascular-279x300-1.jpg"}}};

    else if(r===5)tips="<li>A written request from the patient is required.</li><li>The process may take up to 30 days.</li>";
    else tips="<li>Have your insurance card ready. We’ll confirm your coverage.</li>"+(r===0?'<li>Complete the <a href="#/patients/forms">patient forms</a> before you arrive.</li>':'')+"<li>Please give 24 hours’ notice if you need to cancel or reschedule.</li>";
    out.innerHTML='<p class="sec-label">Your summary</p><p class="lede" style="margin:0 0 6px">You’re calling about '+reasons[r]+(r<4?(l?' at our <strong>'+esc(l.name)+'</strong> office ('+esc(l.days)+')':' at whichever office is soonest'):'')+'.</p><ul class="muted small" style="padding-left:18px;margin:16px 0 22px">'+tips+'</ul><p class="sec-label">Next step: call us</p><a class="big-tel" href="'+TEL+'">'+PH+'</a>'+(r===4?'<p class="small muted">Ext. 3505</p>':'')+'<p class="small muted" style="margin-top:14px">Monday – Friday, 8 AM – 5 PM. In an emergency, call 911. Nothing on this page is sent or booked.</p>';}
  f.addEventListener("change",upd);upd();
}
})();

</script>
